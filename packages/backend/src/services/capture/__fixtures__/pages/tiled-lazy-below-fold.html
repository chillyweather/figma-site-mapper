<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tiled lazy below fold fixture</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #f8f8f8; }
    .section {
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
    }
    .above-fold { background: linear-gradient(135deg, #e05555 0%, #55a0e0 100%); }
    .mid-fold { background: #cccccc; }
    .below-fold { background: #cccccc; }
    .footer { height: 200px; background: linear-gradient(90deg, #9055e0 0%, #55e0d5 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="section above-fold" id="top-section">Top Section — always visible</div>
  <div class="section mid-fold" id="mid-section" data-loaded="false">Mid Section (lazy)</div>
  <div class="section below-fold" id="below-section" data-loaded="false">Below Fold (lazy)</div>
  <div class="footer">Footer</div>
  <script>
    // Use IntersectionObserver to simulate below-fold lazy content load.
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var el = entry.target;
          var id = el.id;
          if (id === 'mid-section') {
            el.style.background = 'linear-gradient(135deg, #55e055 0%, #e0b055 100%)';
            el.textContent = 'Mid Section — loaded below fold';
            el.setAttribute('data-loaded', 'true');
          } else if (id === 'below-section') {
            el.style.background = 'linear-gradient(135deg, #55a0e0 0%, #9055e0 100%)';
            el.textContent = 'Below Fold — loaded on scroll';
            el.setAttribute('data-loaded', 'true');
          }
          observer.unobserve(el);
        }
      });
    }, { threshold: 0.1 });

    observer.observe(document.getElementById('mid-section'));
    observer.observe(document.getElementById('below-section'));
  </script>
</body>
</html>
